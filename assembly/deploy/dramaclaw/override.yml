# Our only additions to DramaClaw's own docker-compose.release.yml (ASSEMBLY_PLAN M0). The values come from the
# --env-file given by up.sh (interpolation), so they do not depend on where DramaClaw's own `env_file: .env` resolves.
# Ports stay DramaClaw's, bound to loopback through ST_API_PORT / ST_WEB_PORT, because DramaClaw CE trusts every
# request as the owner.
services:
  # Images pinned by digest (2.0.2 built from DramaClaw 1ec0236; gateway dramaclaw-gateway ed1e234).
  api:
    image: claymorelab/dramaclaw@sha256:335531e10cf5ddadc596fc1e0fe7a191fd651e4a663355f41d2f67fcec899fe0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PROMPT_EXPORT_PASSWORD: "${PROMPT_EXPORT_PASSWORD}"
      # Pipeline tasks send IndexTTS2 through NewAPI only (indextts2_fal.py refuses the fal path under a task
      # egress context); NewAPI channel `assembly-voice` (assembly/ops/newapi_voice_channel.py) serves index-tts-2.
      INDEXTTS2_PROVIDER: "newapi"
      # DramaClaw's Custom-mode feature list (frontend/src/lib/feature-models.ts) has no CHARACTER_BUILD entry, so
      # DC-character-builder-LLM never gets a NewAPI channel; route character extraction to the mapped scene-builder name.
      CHARACTER_BUILD_MODEL: "DC-scene-builder-LLM"
  newapi:
    image: claymorelab/dramaclaw-gateway@sha256:97df6598082b40cf135e81919da773411ecd26155864a2eb92f7a647d45d93fd
  web:
    image: claymorelab/dramaclaw-frontend@sha256:1d3ae3f469ffe02acf47ffac83937070321c3e6b205ff056e468bc446b79d894
