[Unit]
RequiresMountsFor=/mnt/arcreel/D
After=mnt-arcreel-D.mount
BindsTo=mnt-arcreel-D.mount

[Service]
Environment="OLLAMA_MODELS=/var/lib/ollama-models"
BindPaths=/mnt/arcreel/D/ArcReel/ollama/models:/var/lib/ollama-models
ExecStartPre=+/usr/bin/findmnt --evaluate --noheadings --mountpoint /mnt/arcreel/D --source UUID=F676A3B876A3784F --types ntfs3
ExecStartPre=/usr/bin/test -r /var/lib/ollama-models/manifests/registry.ollama.ai/library/qwen3.5-vimax/9b
