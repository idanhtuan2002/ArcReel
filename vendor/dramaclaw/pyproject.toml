[project]
name = "dramaclaw-identity"
version = "0.0.0+b299bfd"
description = "DramaClaw @ b299bfd identity planner, ported whole (see PORTING.md)"
requires-python = ">=3.12"
# Versions as locked by DramaClaw @ b299bfd (uv.lock).
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-ai-slim[openai,google]==1.107.0",
    "langid==1.1.6",
    "langdetect==1.0.9",
    "wordninja==2.0.0",
    "pypinyin==0.55.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelvideo"]
